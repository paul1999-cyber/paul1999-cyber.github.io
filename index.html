<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table du jour</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#23201a; --muted:#877f72; --line:#e6e1d5;
  --acc:#33795c; --acc-ink:#ffffff; --soft:#e3efe8; --warn:#a15c12; --bad:#b23f36;
  --chip:#eceadf; --shadow:0 1px 3px rgba(35,32,26,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --card:#1e1b16; --ink:#ede9df; --muted:#9c9485; --line:#322e26;
    --acc:#5cb388; --acc-ink:#10231a; --soft:#22352c; --warn:#d99a4e; --bad:#e07a70;
    --chip:#292620; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#1e1b16; --ink:#ede9df; --muted:#9c9485; --line:#322e26;
  --acc:#5cb388; --acc-ink:#10231a; --soft:#22352c; --warn:#d99a4e; --bad:#e07a70;
  --chip:#292620; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(86px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 10px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.num{font-variant-numeric:tabular-nums}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.datebar .dlabel{font-weight:600}
.navbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.total-big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.total-big span{font-size:15px;font-weight:400;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar i.over{background:var(--warn)}
.rings{display:flex;justify-content:space-around;margin-top:12px}
.ring{text-align:center;font-size:12px;color:var(--muted)}
.ring b{display:block;color:var(--ink);font-size:13px;margin-top:2px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline}
.meal-head .sub{color:var(--muted);font-size:13px}
.entry{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:none}
.entry .en{flex:1;min-width:0}
.entry .en small{display:block;color:var(--muted);font-size:12px}
.entry .ek{color:var(--muted);font-size:14px;white-space:nowrap}
.xbtn{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:16px;flex:none}
.xbtn:hover{background:var(--chip);color:var(--bad)}
.addbtn{display:block;width:100%;text-align:center;margin-top:8px;padding:9px;border:1px dashed var(--line);border-radius:10px;color:var(--acc);font-weight:600;font-size:14px}
.btn{display:inline-block;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:10px 16px;font-weight:600;text-align:center}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.btn.wide{display:block;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .fix{flex:none}
.field{margin-top:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;text-align:center;color:var(--muted);font-size:10.5px;padding:4px 0;border-radius:10px;max-width:110px}
.tab svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc);font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.mcard{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mhead b{font-size:17px}
.pick-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 2px;border-top:1px solid var(--line)}
.pick-row small{color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.cat{flex:none;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.cat.on{background:var(--soft);color:var(--acc);border-color:var(--acc);font-weight:600}
.foodrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.foodrow .fn{flex:1;min-width:0}
.foodrow .fn small{display:block;color:var(--muted);font-size:12px}
.tagp{font-size:10px;background:var(--soft);color:var(--acc);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.savebar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;z-index:25;display:flex;justify-content:center;pointer-events:none}
.savebar .in{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px;margin:0 14px;max-width:532px;width:100%}
.savebar .st{flex:1;font-size:13px;color:var(--muted)}
.savebar .st.dirty{color:var(--warn);font-weight:600}
.savebar .st.saved{color:var(--acc);font-weight:600}
.wlist .entry .en{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--acc);vertical-align:middle;margin-right:5px}
.legend i.dot{width:8px;height:8px;border:none;border-radius:50%;background:var(--muted)}
.legend i.dash{border-top-style:dashed;border-top-color:var(--muted)}
.verdict{margin-top:10px;padding:10px;border-radius:10px;background:var(--soft);font-size:14px}
.sportrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.wizsteps{color:var(--muted);font-size:12px;margin-bottom:4px;letter-spacing:.5px}
.bigstat{display:flex;gap:10px;margin-top:10px}
.bigstat .bs{flex:1;background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.bigstat .bs b{display:block;font-size:20px}
.bigstat .bs span{font-size:11.5px;color:var(--muted)}
.plist .entry{align-items:center}
.plink{color:var(--acc);font-weight:600;font-size:14px}
textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:110px}
.welcome{text-align:center;padding:44px 10px 20px}
.welcome h1{font-size:26px;margin:14px 0 6px}
.welcome p{color:var(--muted);max-width:38ch;margin:0 auto 22px}
.wemoji{font-size:44px}
@media (prefers-reduced-motion: no-preference){
  .btn,.tab,.chip{transition:opacity .12s ease,background .12s ease}
}
@media (min-width:600px){ .modal{align-items:center} .mcard{border-radius:16px} }
</style>

<div class="app">
  <div class="topbar" id="topbar">
    <div class="brand">Table du jour<small>Suivi nutrition &amp; poids</small></div>
    <button class="chip" id="profChip" data-act="switch-open">–</button>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabbar">
  <button class="tab" data-act="tab" data-tab="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>Journée</button>
  <button class="tab" data-act="tab" data-tab="foods"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Aliments</button>
  <button class="tab" data-act="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-11"/></svg>Suivi</button>
  <button class="tab" data-act="tab" data-tab="weight"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 4"/><path d="M3 21h18"/></svg>Poids</button>
  <button class="tab" data-act="tab" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Objectifs</button>
  <button class="tab" data-act="tab" data-tab="profiles"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profils</button>
</nav>
<div class="modal hidden" id="modal"><div class="mcard" id="mcard"></div></div>

<script>
'use strict';
/* ================= utilitaires ================= */
var NS='tdj.v1';
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var COMB=new RegExp('[\\u0300-\\u036f]','g');
function slug(s){return s.toLowerCase().normalize('NFD').replace(COMB,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function num(v){if(v==null)return NaN;v=String(v).trim().replace(',','.');if(v==='')return NaN;return Number(v);}
function fmt(n,d){if(!isFinite(n))return'–';return n.toLocaleString('fr-FR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function addDays(ds,n){var d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function dateLabel(ds){var d=new Date(ds+'T12:00:00');var s=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);}
function dateShort(ds){var d=new Date(ds+'T12:00:00');return pad2(d.getDate())+'/'+pad2(d.getMonth()+1);}

/* ================= stockage (clés versionnées, jamais d'écriture au chargement) ================= */
function rawGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function load(k){var raw=null,i;for(i=0;i<3;i++){raw=rawGet(k);if(raw!==null)break;}
  if(raw===null)return null;
  try{return JSON.parse(raw);}catch(e){console.warn('Donnée illisible (conservée, non écrasée) :',k);return null;}}
var snapDone=false;
function touchSnapshot(){ /* photo quotidienne de tout le stockage AVANT la 1re écriture de la session */
  if(snapDone)return;snapDone=true;
  try{var prev=load(NS+'.autosnap');var t=todayStr();
    if(prev&&prev.date===t)return;
    localStorage.setItem(NS+'.autosnap',JSON.stringify({date:t,data:exportAll()}));
  }catch(e){}}
function save(k,val){touchSnapshot();
  try{localStorage.setItem(k,JSON.stringify(val));}
  catch(e){alert('Impossible d’enregistrer : '+e.message);}}
function pk(id,part){return NS+'.p.'+id+'.'+part;}

  journal:load(pk(id,'journal'))||{},weights:load(pk(id,'weights'))||[],foods:load(pk(id,'foods'))||[]};}
var meta=load(NS+'.meta');
var P=null;
function saveP(part){save(pk(P.id,part),P[part]);}
function saveMeta(){save(NS+'.meta',meta);}

function exoOf(id){var r=EXOS[0];EXOS.forEach(function(x){if(x[0]===id)r=x;});return r;}
function exoCalc(met,pctCarb,min,kg){var kcal=(met-1)*3.5*kg/200*min;
  return{kcal:Math.round(kcal),carb:Math.round(kcal*pctCarb/100/4)};}
function ageOf(birth){if(!birth)return 30;var b=new Date(birth+'T12:00:00'),n=new Date();
  var a=n.getFullYear()-b.getFullYear();var m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
function bmrOf(pr,w){return Math.round(10*w+6.25*pr.height-5*ageOf(pr.birth)+(pr.sex==='F'?-161:5));}
function tdeeOf(pr,w){if(!pr||!w)return null;
  /* dépense de base : métabolisme type (travail) + marche — le sport se saisit jour par jour */
  var t=bmrOf(pr,w)*(WORKF[pr.work]||1.2);
  t+=(pr.walk||0)/60*2.5*w;
  return Math.round(t);}
function latestWeight(){if(P&&P.weights.length){return sortedWeights()[P.weights.length-1].kg;}
  return P&&P.profile?P.profile.weight:null;}
function sortedWeights(){return P.weights.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});}

function allFoods(){return FOODS.concat(P&&P.foods?P.foods:[]);}
function findFood(id){var r=null;allFoods().forEach(function(f){if(f.id===id)r=f;});return r;}
function catList(){var c=[];allFoods().forEach(function(f){if(c.indexOf(f.cat)<0)c.push(f.cat);});return c;}
function unitOptions(f){var u=[];
  if(f.liq){u.push({c:'ml',l:'ml'});}
  else{u.push({c:'raw',l:f.cook?'g (cru)':'g'});if(f.cook)u.push({c:'cook',l:'g (cuit)'});}
  (f.portions||[]).forEach(function(p,i){u.push({c:'p'+i,l:p[0]});});
  return u;}
function gramsRaw(f,qty,uc){
  if(uc==='raw'||uc==='ml')return qty;
  if(uc==='cook')return qty/(f.cook||1);
  var i=Number(uc.slice(1));var p=(f.portions||[])[i];
  return p?qty*p[1]:qty;}

var TAB='day';
var CUR=todayStr();
var M={};           /* état du panneau modal */
var W=null;         /* état du wizard */
var goalsDirty=false;
var MEALS=[['matin','Matin'],['midi','Midi'],['collation','Collation'],['soir','Soir']];

function goalCal(){return P&&P.goals?P.goals.cal:2000;}
function goalProt(){return P&&P.goals?P.goals.prot:110;}
function goalFat(){return P&&P.goals&&isFinite(P.goals.fat)&&P.goals.fat>0?P.goals.fat:Math.round(goalCal()*0.35/9);}
function goalCarb(){return P&&P.goals&&isFinite(P.goals.carb)&&P.goals.carb>0?P.goals.carb:Math.max(0,Math.round((goalCal()-goalProt()*4-goalFat()*9)/4));}
function goalFib(){return P&&P.goals&&isFinite(P.goals.fib)&&P.goals.fib>0?P.goals.fib:30;}
function dayEntries(ds){var d=P.journal[ds];if(!d)return[];var out=[];
  MEALS.forEach(function(m){(d[m[0]]||[]).forEach(function(e){out.push(e);});});return out;}
function sumOf(list){var s={kcal:0,p:0,f:0,c:0,fb:0};
  list.forEach(function(e){s.kcal+=e.kcal;s.p+=e.p;s.f+=e.f;s.c+=e.c;s.fb+=e.fb;});return s;}

function render(){
  var hasP=meta&&meta.profiles&&meta.profiles.length&&P&&P.profile;
  $('#tabbar').style.display=hasP?'flex':'none';
  $('#profChip').style.display=hasP?'':'none';
  if(hasP)$('#profChip').textContent=P.profile.name;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===TAB);});
  if(!hasP){renderWelcome();return;}
  if(TAB==='day')renderDay();
  else if(TAB==='foods')renderFoods();

}

/* ---- Journée ---- */
function ringSVG(label,val,goal,unit){
  var pct=goal>0?val/goal:0;var C=2*Math.PI*20;var over=pct>1;
  return '<div class="ring"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">'+
  '<circle cx="26" cy="26" r="20" fill="none" stroke="var(--chip)" stroke-width="5"/>'+
  '<circle cx="26" cy="26" r="20" fill="none" stroke="'+(over?'var(--warn)':'var(--acc)')+'" stroke-width="5" stroke-linecap="round" '+
  'stroke-dasharray="'+(C*Math.min(1,pct)).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 26 26)"/></svg>'+
  label+'<b class="num"'+(over?' style="color:var(--warn)"':'')+'>'+fmt(val)+' / '+fmt(goal)+' '+unit+
  (over?'<br>+'+Math.round((pct-1)*100)+' %':'')+'</b></div>';
}
function renderDay(){
  var day=P.journal[CUR]||{};
  var tot=sumOf(dayEntries(CUR));
  var sport=day.sport||[];var sKcal=0,sCarb=0;
  sport.forEach(function(e){sKcal+=e.kcal;sCarb+=e.carb||0;});
  var gc=goalCal();var budget=gc+sKcal;var rest=budget-tot.kcal;var pct=Math.min(1.15,tot.kcal/budget);
  var h='<div class="datebar"><button class="navbtn" data-act="day-prev" aria-label="Jour précédent">‹</button>'+
    '<div class="dlabel">'+esc(dateLabel(CUR))+'</div>'+
    '<button class="navbtn" data-act="day-next" aria-label="Jour suivant">›</button></div>';

  h+='<div class="card"><div class="total-big num">'+fmt(tot.kcal)+' <span>/ '+fmt(budget)+' kcal</span></div>'+
    (sKcal?'<div class="hint num" style="margin-top:0">Objectif '+fmt(gc)+' + sport '+fmt(sKcal)+' kcal</div>':'')+
    '<div class="bar"><i class="'+(tot.kcal>budget?'over':'')+'" style="width:'+(Math.min(1,pct)*100).toFixed(0)+'%"></i></div>'+
    '<div class="hint num">'+(rest>=0?'Il te reste '+fmt(rest)+' kcal':'Dépassé de '+fmt(-rest)+' kcal (+'+Math.round(-rest/budget*100)+' %)')+'</div>'+
    '<div class="rings">'+ringSVG('Protéines',Math.round(tot.p),goalProt(),'g')+
    ringSVG('Lipides',Math.round(tot.f),goalFat(),'g')+
    ringSVG('Glucides',Math.round(tot.c),goalCarb(),'g')+
    ringSVG('Fibres',Math.round(tot.fb),goalFib(),'g')+'</div></div>';
  MEALS.forEach(function(m){
    var list=day[m[0]]||[];var s=sumOf(list);
    h+='<div class="card"><div class="meal-head"><h3>'+m[1]+'</h3><span class="sub num">'+(list.length?fmt(s.kcal)+' kcal':'')+'</span></div>';
    list.forEach(function(e,i){
      h+='<div class="entry"><div class="en">'+esc(e.n)+'<small class="num">'+fmt(e.q,e.q%1?1:0)+' × '+esc(e.u)+'</small>'+
      '<small class="num">P '+fmt(e.p,1)+' · L '+fmt(e.f,1)+' · G '+fmt(e.c,1)+' · Fi '+fmt(e.fb,1)+' g</small></div>'+
      '<span class="ek num">'+fmt(e.kcal)+' kcal</span>'+
      '<button class="xbtn" data-act="del-entry" data-meal="'+m[0]+'" data-idx="'+i+'" aria-label="Supprimer">×</button></div>';
    });
    if(!list.length){var yd=P.journal[addDays(CUR,-1)];
      if(yd&&(yd[m[0]]||[]).length)h+='<button class="addbtn" style="border-style:solid" data-act="copy-yday" data-meal="'+m[0]+'">↺ Reprendre le repas d’hier ('+fmt(sumOf(yd[m[0]]).kcal)+' kcal)</button>';}
    h+='<button class="addbtn" data-act="add-food" data-meal="'+m[0]+'">+ Ajouter un aliment</button></div>';
  });
  h+='<div class="card"><div class="meal-head"><h3>Sport</h3><span class="sub num">'+(sport.length?'−'+fmt(sKcal)+' kcal · '+fmt(sCarb)+' g de glucides brûlés':'')+'</span></div>';

/* ---- Suivi nutrition ---- */
var TRANGE=7;
function trackSpark(data,key,tgt,dir){
  var W2=320,H2=74,L2=6,R2=6,T2=8,B2=14;
  var vals=data.filter(function(x){return x.s;}).map(function(x){return x.s[key];});
  var ymax=Math.max(tgt*1.2,Math.max.apply(null,vals))*1.05;
  var n=data.length;var bw=Math.max(2,(W2-L2-R2)/n*0.65);
  function X(i){return L2+(i+0.5)/n*(W2-L2-R2);}
  function Y(v){return T2+(1-v/ymax)*(H2-T2-B2);}
  var s='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto" aria-hidden="true">';
  data.forEach(function(x,i){if(!x.s)return;var v=x.s[key];
    var bad=dir==='over'?v>tgt:v<tgt;
    s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,(H2-B2)-Y(v)).toFixed(1)+'" rx="1.5" fill="'+(bad?'var(--warn)':'var(--acc)')+'"><title>'+dateShort(x.d)+' : '+fmt(v)+'</title></rect>';});
  s+='<line x1="'+L2+'" y1="'+Y(tgt).toFixed(1)+'" x2="'+(W2-R2)+'" y2="'+Y(tgt).toFixed(1)+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/>';
  s+='<text x="'+L2+'" y="'+(H2-3)+'" font-size="9" fill="var(--muted)">'+dateShort(data[0].d)+'</text>';
  s+='<text x="'+(W2-R2)+'" y="'+(H2-3)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+dateShort(data[n-1].d)+'</text>';
  return s+'</svg>';}
function renderTrack(){
  var data=[];var today=todayStr();var nSess=0;
  for(var i=TRANGE-1;i>=0;i--){var ds=addDays(today,-i);var es=dayEntries(ds);
    var dd=P.journal[ds];var sk=0;
    if(dd&&dd.sport)dd.sport.forEach(function(e){sk+=e.kcal;nSess++;});
    data.push({d:ds,s:es.length?sumOf(es):null,sk:sk});}
  var tracked=data.filter(function(x){return x.s;});
  var n=tracked.length;
  var h='<div class="card" style="padding:10px 14px"><div class="row">';
  [[7,'7 jours'],[14,'14 jours'],[30,'30 jours']].forEach(function(r){
    h+='<button class="btn '+(TRANGE===r[0]?'':'sec')+'" data-act="track-range" data-n="'+r[0]+'">'+r[1]+'</button>';});
  h+='</div></div>';
  if(!n){h+='<div class="card"><p class="hint" style="margin:0">Aucun repas enregistré sur les '+TRANGE+' derniers jours. Ajoute des aliments dans l’onglet Journée pour alimenter le suivi.</p></div>';
    $('#view').innerHTML=h;return;}
  var avgK=0;tracked.forEach(function(x){avgK+=x.s.kcal;});avgK/=n;
  var okCal=tracked.filter(function(x){return x.s.kcal<=(goalCal()+(x.sk||0))*1.05;}).length;
  var idx=data.length-1;if(!data[idx].s)idx--;
  var streak=0;while(idx>=0&&data[idx].s){streak++;idx--;}
  h+='<div class="card"><h3>Vue d’ensemble · '+TRANGE+' derniers jours</h3><div class="bigstat">'+
  '<div class="bs"><b class="num">'+n+'/'+TRANGE+'</b><span>jours suivis</span></div>'+
  '<div class="bs"><b class="num">'+Math.round(okCal/n*100)+'%</b><span>jours dans l’objectif kcal</span></div>'+
  '<div class="bs"><b class="num">'+streak+'</b><span>jours suivis d’affilée</span></div></div>';
  var totalSport=0;data.forEach(function(x){totalSport+=x.sk;});
  var td=P.profile?tdeeOf(P.profile,latestWeight()):null;
  if(td){var def=td+totalSport/TRANGE-avgK;
    h+='<p class="hint num" style="margin-bottom:'+(totalSport?'2px':'0')+'">Déficit moyen estimé (sport inclus) : '+fmt(def)+' kcal/j → tendance '+(def>0?'−':'+')+fmt(Math.abs(def)*7/7700,1)+' kg/semaine.</p>';}
  if(totalSport)h+='<p class="hint num" style="margin-top:2px;margin-bottom:0">Sport : '+fmt(totalSport)+' kcal brûlées sur la période ('+nSess+' activité'+(nSess>1?'s':'')+' saisie'+(nSess>1?'s':'')+').</p>';
  h+='</div>';
  var sp=0,sf=0,sc=0;tracked.forEach(function(x){sp+=x.s.p*4;sf+=x.s.f*9;sc+=x.s.c*4;});
  var stot=sp+sf+sc;
  if(stot>0){
    var pp=Math.round(sp/stot*100),pf=Math.round(sf/stot*100),pc=Math.max(0,100-pp-pf);
    var gtot=goalProt()*4+goalFat()*9+goalCarb()*4;
    var gp=Math.round(goalProt()*4/gtot*100),gf2=Math.round(goalFat()*9/gtot*100),gc3=Math.max(0,100-gp-gf2);
    h+='<div class="card"><h3>Répartition des calories</h3>'+
    '<div class="bar" style="height:14px;display:flex">'+
    '<i style="width:'+pp+'%;background:var(--acc);border-radius:5px 0 0 5px"></i>'+
    '<i style="width:'+pf+'%;background:var(--warn);border-radius:0"></i>'+
    '<i style="width:'+pc+'%;background:var(--muted);border-radius:0 5px 5px 0"></i></div>'+
    '<p class="hint num" style="margin-bottom:0">Protéines '+pp+' % · Lipides '+pf+' % · Glucides '+pc+' % — répartition cible : '+gp+' / '+gf2+' / '+gc3+' %</p></div>';}
  [['kcal','Calories','kcal',goalCal(),'over'],
   ['p','Protéines','g',goalProt(),'under'],
   ['f','Lipides','g',goalFat(),'over'],
   ['c','Glucides','g',goalCarb(),'over'],
   ['fb','Fibres','g',goalFib(),'under']].forEach(function(mt){
    var key=mt[0],label=mt[1],unit=mt[2],tgt=mt[3],dir=mt[4];
    var vals=tracked.map(function(x){return x.s[key];});
    var avg=0,mx=0;vals.forEach(function(v){avg+=v;if(v>mx)mx=v;});avg/=n;
    var count,countLabel;
    if(dir==='over'){count=tracked.filter(function(x){return x.s[key]>tgt;}).length;countLabel='Dépassement';}
    else{count=tracked.filter(function(x){return x.s[key]>=tgt;}).length;countLabel='Cible atteinte';}
    var extra='';
    if(dir==='over'&&count){var ov=0;
      tracked.forEach(function(x){if(x.s[key]>tgt)ov+=(x.s[key]-tgt)/tgt;});
      extra=' · dépassement moyen <b>+'+Math.round(ov/count*100)+' %</b>';}
    h+='<div class="card"><div class="meal-head"><h3>'+label+'</h3><span class="sub num">cible '+fmt(tgt)+' '+unit+'/j</span></div>'+
    trackSpark(data,key,tgt,dir)+
    '<p class="hint num" style="margin-bottom:0">Moyenne '+fmt(avg)+' '+unit+'/j ('+Math.round(avg/tgt*100)+' % de la cible) · max '+fmt(mx)+' · <b>'+countLabel+' : '+Math.round(count/n*100)+' % des jours</b> ('+count+'/'+n+')'+extra+'</p></div>';
  });
  $('#view').innerHTML=h;
}

/* ---- Poids ---- */
function fmtW(v){return fmt(v,v%1?1:0);} /* cm : décimale seulement si utile */
function waistAdvice(imc,waist,sex,heightCm){
  /* avis combiné IMC + tour de taille (seuils OMS/NIH, spécifiques au sexe) */
  if(!waist||!isFinite(imc))return null;
  var w1=sex==='F'?80:94,w2=sex==='F'?88:102;
  var wl=waist>w2?2:(waist>=w1?1:0);
  var txt;
  if(wl===0)txt=imc>=25
    ?'Tour de taille dans la zone favorable (moins de '+w1+' cm) malgré un IMC au-dessus de 25 : la graisse abdominale — celle qui pèse le plus sur la santé — est limitée. Profil plutôt rassurant, cohérent avec un poids de forme personnel plus élevé que la zone IMC standard.'
    :'IMC et tour de taille dans les zones favorables : profil métabolique au vert.';
  else if(wl===1)txt='Tour de taille entre '+w1+' et '+w2+' cm : risque métabolique modérément accru'+(imc>=25?', qui se cumule avec l’IMC':'')+'. La perte en cours va directement dans le bon sens — le tour de taille descend en général plus vite que prévu.';
  else txt='Tour de taille au-dessus de '+w2+' cm : c’est la graisse abdominale qui pèse le plus sur le risque cardiovasculaire et métabolique'+(imc>=30?' — combinée à l’IMC, la perte de poids en cours est clairement prioritaire':'')+'. Chaque centimètre perdu compte au moins autant que chaque kilo.';
  if(heightCm)txt+=' Ratio tour de taille / taille : '+fmt(waist/heightCm,2).replace('.',',')+' (repère : rester sous 0,50).';
  return txt;}
function movingAvg(ws,i){var s=0,c=0;for(var j=0;j<=i;j++){if(daysBetween(ws[j].d,ws[i].d)<7){s+=ws[j].kg;c++;}}return s/c;}
function predictionAt(ws,ds){
  if(!P.goals||!P.profile||!ws.length)return null;
  var w0=ws[0].kg;var td=tdeeOf(P.profile,w0);if(!td)return null;
  var slope=(P.goals.cal-td)/7700;
  return w0+slope*daysBetween(ws[0].d,ds);}
function chartHTML(a,b){
  var ws=sortedWeights();
  var rangeMode=!!(a&&b);
  if(rangeMode)ws=ws.filter(function(w){return w.d>=a&&w.d<=b;});
  if(ws.length<2)return '<p class="hint">Ajoute au moins deux pesées pour voir la courbe.</p>';
  var hasPred=P.goals&&P.profile;
  var t0=ws[0].d;
  var tEnd=ws[ws.length-1].d;
  if(hasPred&&!rangeMode){var minEnd=addDays(t0,21);if(daysBetween(t0,tEnd)<21)tEnd=minEnd;}
  var total=Math.max(1,daysBetween(t0,tEnd));
  var vals=[];ws.forEach(function(w,i){vals.push(w.kg);vals.push(movingAvg(ws,i));});
  if(hasPred){var p0=predictionAt(ws,t0),p1=predictionAt(ws,tEnd);if(p0!=null){vals.push(p0);vals.push(p1);}}
  var ymin=Math.floor(Math.min.apply(null,vals)-0.5),ymax=Math.ceil(Math.max.apply(null,vals)+0.5);
  var Wd=320,H=190,L=36,R=10,T=10,B=24;
  function X(ds){return L+daysBetween(t0,ds)/total*(Wd-L-R);}
  function Y(v){return T+(ymax-v)/(ymax-ymin)*(H-T-B);}
  var svg='<svg viewBox="0 0 '+Wd+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Courbe de poids">';
  var ticks=[ymin,(ymin+ymax)/2,ymax];
  ticks.forEach(function(v){svg+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(Wd-R)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/>'+
    '<text x="'+(L-5)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)" style="font-variant-numeric:tabular-nums">'+fmt(v,v%1?1:0)+'</text>';});
  svg+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)">'+dateShort(t0)+'</text>'+
    '<text x="'+(Wd-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+dateShort(tEnd)+'</text>';
  if(hasPred){var pa=predictionAt(ws,t0),pb=predictionAt(ws,tEnd);
    if(pa!=null)svg+='<line x1="'+X(t0)+'" y1="'+Y(pa)+'" x2="'+X(tEnd)+'" y2="'+Y(pb)+'" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4"/>';}
  var pts='';ws.forEach(function(w,i){pts+=(i?' ':'')+X(w.d).toFixed(1)+','+Y(movingAvg(ws,i)).toFixed(1);});
  svg+='<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  ws.forEach(function(w){svg+='<circle cx="'+X(w.d).toFixed(1)+'" cy="'+Y(w.kg).toFixed(1)+'" r="3" fill="var(--muted)" stroke="var(--card)" stroke-width="1.5"><title>'+dateShort(w.d)+' : '+fmt(w.kg,1)+' kg</title></circle>';});
  var last=ws[ws.length-1];
  svg+='<circle cx="'+X(last.d).toFixed(1)+'" cy="'+Y(movingAvg(ws,ws.length-1)).toFixed(1)+'" r="4" fill="var(--acc)"/>';
  svg+='</svg>';
  svg+='<div class="legend"><span><i></i>Moyenne 7 jours</span><span><i class="dot"></i>Pesées</span>'+(hasPred?'<span><i class="dash"></i>Prévision</span>':'')+'</div>';
  if(ws.length>=5&&hasPred){
    var avg=movingAvg(ws,ws.length-1);var pred=predictionAt(ws,last.d);
    if(pred!=null){var diff=avg-pred;var v;
      if(diff<=-0.3)v='Tu es en avance de '+fmt(-diff,1)+' kg sur la prévision. Continue comme ça — pas besoin de baisser les calories.';
      else if(diff<0.3)v='Ta moyenne 7 jours colle à la prévision ('+fmt(avg,1)+' kg). Le plan fonctionne.';
      else v='Tu es à '+fmt(diff,1)+' kg au-dessus de la prévision. Attends 3 semaines pleines avant d’ajuster ; ensuite, baisse de 100 kcal maximum.';
      svg+='<div class="verdict">'+v+'</div>';}}
  return svg;
}

function renderGoals(){
  var pr=P.profile;var w=latestWeight();
  var td=tdeeOf(pr,w);var bmr=w?bmrOf(pr,w):null;

  '<div class="field"><label for="gProt">Protéines par jour (g)</label><input id="gProt" type="text" inputmode="numeric" value="'+esc(String(g.prot))+'"></div>';

  var vFib=g.fib>0?g.fib:30;

  '<div class="err" id="gErr"></div></div>';

    h+='<div class="card"><h3>Ce que ça donne</h3><p class="hint" style="margin:0">Déficit ≈ '+fmt(def)+' kcal/jour → environ <b>'+fmt(def*7/7700,1).replace('.',',')+' kg par semaine</b>.'+
    (g.target&&w?' Poids cible '+fmt(num(String(g.target)),1)+' kg : à ce rythme, environ '+fmt((w-num(String(g.target)))/(def*7/7700)/4.33,0)+' mois.':'')+'</p></div>';}}

/* ---- ajout d'aliment au journal ---- */
function openPick(meal){M={mode:'pick',meal:meal||'midi'};
  var chips='';var yd=P.journal[addDays(CUR,-1)];
  if(yd)MEALS.forEach(function(m){var l=yd[m[0]]||[];
    if(l.length)chips+='<button class="cat" data-act="copy-meal" data-src="'+m[0]+'">↺ '+m[1]+' d’hier · '+fmt(sumOf(l).kcal)+' kcal</button>';});
  openModal(mhead('Ajouter un aliment')+
  (chips?'<p class="hint" style="margin:0 0 2px">Recopier un repas d’hier dans ce repas :</p><div class="cats" style="padding-top:2px">'+chips+'</div>':'')+
  '<input id="pickSearch" type="search" placeholder="Rechercher…" autocomplete="off">'+
  '<div id="pickList"></div>');
  renderPickList('');
  $('#pickSearch').focus();}
function recentNames(){var names=[];
  for(var i=0;i<14;i++){var dd=P.journal[addDays(todayStr(),-i)];if(!dd)continue;
    MEALS.forEach(function(m){(dd[m[0]]||[]).forEach(function(e){if(names.indexOf(e.n)<0)names.push(e.n);});});}
  return names;}
function renderPickList(q){q=(q||'').toLowerCase();var out='';var n=0;
  var arr=allFoods().slice().sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  if(!q){ /* sans recherche : les aliments récemment utilisés en premier */
    var rec=recentNames();
    if(rec.length){var byName={};arr.forEach(function(f){byName[f.name]=f;});
      var ordered=[];rec.forEach(function(nm){if(byName[nm]){ordered.push(byName[nm]);delete byName[nm];}});
      arr.forEach(function(f){if(byName[f.name])ordered.push(f);});
      arr=ordered;}}
  arr.forEach(function(f){if(q&&f.name.toLowerCase().indexOf(q)<0)return;if(n>=40)return;n++;
    out+='<button class="pick-row" data-act="pick-food" data-id="'+esc(f.id)+'"><span>'+esc(f.name)+(f.custom?'<span class="tagp">perso</span>':'')+'</span><small class="num">'+fmt(f.kcal)+' kcal/100'+(f.liq?'ml':'g')+'</small></button>';});
  $('#pickList').innerHTML=out||'<p class="hint">Rien trouvé — crée-le dans l’onglet Aliments.</p>';}
function openQty(food,meal){M={mode:'qty',food:food,meal:meal||M.meal||'midi'};
  var opts=unitOptions(food);var defUnit=opts[0].c,defQty=food.liq?200:100;
  if(food.portions&&food.portions.length){defUnit='p0';defQty=1;}
  var h=mhead(esc(food.name))+
  '<p class="hint" style="margin-top:0" class="num">Pour 100 '+(food.liq?'ml':'g'+(food.cook&&food.cook>1?' crus':''))+' : '+fmt(food.kcal)+' kcal · P '+fmt(food.prot,1)+' · L '+fmt(food.fat,1)+' · G '+fmt(food.carb,1)+' · Fi '+fmt(food.fib,1)+'</p>'+
  '<div class="field"><label>Repas</label><select id="mealSel">';

  h+='</select></div><div class="row" style="margin-top:10px">'+
  '<input id="qtyInput" type="text" inputmode="decimal" value="'+defQty+'" aria-label="Quantité">'+
  '<select id="unitSel">';
  opts.forEach(function(o){h+='<option value="'+o.c+'"'+(o.c===defUnit?' selected':'')+'>'+esc(o.l)+'</option>';});

function updateQtyPreview(){if(M.mode!=='qty')return;
  var q=num($('#qtyInput').value);var u=$('#unitSel').value;
  if(!isFinite(q)||q<=0){$('#qtyPrev').textContent='Quantité invalide';return;}
  var g=gramsRaw(M.food,q,u);var r=g/100;
  $('#qtyPrev').textContent='≈ '+fmt(M.food.kcal*r)+' kcal · P '+fmt(M.food.prot*r,1)+' g · L '+fmt(M.food.fat*r,1)+' g · Fi '+fmt(M.food.fib*r,1)+' g';}
function qtyAdd(){var q=num($('#qtyInput').value);var u=$('#unitSel').value;var meal=$('#mealSel').value;
  if(!isFinite(q)||q<=0){$('#qtyPrev').textContent='Quantité invalide';return;}
  var f=M.food;var g=gramsRaw(f,q,u);var r=g/100;var ul='';
  unitOptions(f).forEach(function(o){if(o.c===u)ul=o.l;});
  var e={n:f.name,q:q,u:ul,kcal:Math.round(f.kcal*r),p:+(f.prot*r).toFixed(1),f:+(f.fat*r).toFixed(1),c:+(f.carb*r).toFixed(1),fb:+(f.fib*r).toFixed(1)};
  if(!P.journal[CUR])P.journal[CUR]={};
  if(!P.journal[CUR][meal])P.journal[CUR][meal]=[];
  P.journal[CUR][meal].push(e);
  saveP('journal');closeModal();TAB='day';render();}

function createFoodSave(){

      carb=num($('#cfCarb').value)||0,fib=num($('#cfFib').value)||0,cook=num($('#cfCook').value);

      fx.cook=isFinite(cook)&&cook>0?cook:null;fx.liq=$('#cfLiq').checked;fx.portions=M.portions.slice();}

function wizRead(){var d=W.data;var s=W.step;

function wizCreate(){var d=W.data;

function offerDocx(name,u8){
  var p;
  try{p=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);}
  catch(e){p=Promise.resolve(null);}
  p.then(function(dls){
    if(!dls){dl(name,u8,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');return;}
    return dls.save({filename:name,data:u8}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&(err.code==='extension_not_enabled'||err.code==='rejected_extension')){
        /* la visionneuse n'autorise pas le .docx : on enregistre en .docx.txt (autorisé),
           l'utilisateur enlève le .txt du nom et Word l'ouvre normalement */
        return dls.save({filename:name+'.txt',data:u8}).then(function(){
          var mi=$('#repMsg');
          if(mi){mi.style.color='var(--warn)';
            mi.textContent='La visionneuse claude.ai n’autorise pas le format .docx : le rapport a été enregistré sous « '+name+'.txt ». Renomme le fichier en supprimant simplement le « .txt » à la fin, et il s’ouvrira dans Word.';}
        }).catch(function(e2){
          if(e2&&e2.code==='declined')return;
          var m3=$('#repMsg');
          if(m3)m3.textContent='Téléchargement impossible ('+((e2&&e2.code)||'erreur')+').';
        });}
      var m2=$('#repMsg');
      if(m2)m2.textContent='Téléchargement Word impossible ici ('+((err&&err.code)||'erreur')+'). Réessaie, ou utilise les CSV ci-dessous.';
    });
  }).catch(function(){});}

function openSwitcher(){var h=mhead('Changer de profil');
  meta.profiles.forEach(function(p){
    h+='<button class="pick-row" data-act="prof-switch" data-id="'+esc(p.id)+'"><span>'+esc(p.name)+'</span>'+(p.id===P.id?'<small>actif</small>':'')+'</button>';});
  h+='<button class="addbtn" data-act="prof-new">+ Créer un profil</button>';
  openModal(h);}

/* ================= délégation d'événements ================= */
document.addEventListener('click',function(e){
  if(e.target.id==='repOut'){e.target.select();return;}
  var el=e.target.closest('[data-act]');
  if(!el)return; /* le fond sombre ne ferme plus la box — seule la croix ferme */
  var a=el.dataset.act;
  if(a==='tab'){TAB=el.dataset.tab;render();}
  else if(a==='modal-close')closeModal();
  else if(a==='day-prev'){CUR=addDays(CUR,-1);render();}
  else if(a==='day-next'){CUR=addDays(CUR,1);render();}
  else if(a==='add-food')openPick(el.dataset.meal);
  else if(a==='del-entry'){var d=P.journal[CUR];if(d&&d[el.dataset.meal]){d[el.dataset.meal].splice(Number(el.dataset.idx),1);saveP('journal');render();}}
  else if(a==='pick-food'){var f=findFood(el.dataset.id);if(f)openQty(f,M.meal);}
  else if(a==='food-open'){var f2=findFood(el.dataset.id);if(f2)openQty(f2,'midi');}
  else if(a==='food-cat'){foodCat=el.dataset.cat;render();}
  else if(a==='food-create')openCreateFood();
  else if(a==='food-edit')openCreateFood(el.dataset.id);
  else if(a==='cf-port-add')cfPortAdd();
  else if(a==='cf-port-del'){M.portions.splice(Number(el.dataset.i),1);renderCfPorts();}
  else if(a==='copy-meal'){var ys2=P.journal[addDays(CUR,-1)];var src2=ys2?ys2[el.dataset.src]||[]:[];
    if(src2.length){if(!P.journal[CUR])P.journal[CUR]={};
      var tgt=M.meal||'midi';
      P.journal[CUR][tgt]=(P.journal[CUR][tgt]||[]).concat(JSON.parse(JSON.stringify(src2)));
      saveP('journal');closeModal();TAB='day';render();}}
  else if(a==='food-create-save')createFoodSave();
  else if(a==='food-del'){if(confirm('Supprimer cet aliment personnalisé ?')){P.foods=P.foods.filter(function(x){return x.id!==el.dataset.id;});saveP('foods');render();}}
  else if(a==='qty-add')qtyAdd();
  else if(a==='weight-add'){
    var kg=num($('#wKg').value);var dt=$('#wDate').value||todayStr();
    if(!isFinite(kg)||kg<30||kg>300){$('#wErr').textContent='Entre un poids valide (ex : 98,4).';return;}
    var waist=num($('#wWaist').value);
    if($('#wWaist').value.trim()!==''&&(!isFinite(waist)||waist<40||waist>250)){$('#wErr').textContent='Tour de taille en cm (entre 40 et 250), ou laisse vide.';return;}
    CURWDATE=dt;
    P.weights=P.weights.filter(function(w){return w.d!==dt;});
    var we2={d:dt,kg:Math.round(kg*10)/10};
    if(isFinite(waist)&&waist>=40&&waist<=250)we2.waist=Math.round(waist*10)/10;
    P.weights.push(we2);
    saveP('weights');render();}
  else if(a==='weight-del'){P.weights=P.weights.filter(function(w){return w.d!==el.dataset.d;});saveP('weights');render();}
  else if(a==='rate'){
    var w3=latestWeight();var td=tdeeOf(P.profile,w3);
    if(td){$('#gCal').value=String(Math.round((td-Number(el.dataset.rate)*1100)/10)*10);
      goalsDirty=true;var st=$('#gState');st.textContent='Modifications non enregistrées';st.className='st dirty';}}
  else if(a==='goals-save'){
    var cal=num($('#gCal').value),prot=num($('#gProt').value),tg=num($('#gTarget').value);
    if(!isFinite(cal)||cal<800||cal>8000){$('#gErr').textContent='Calories : un nombre entre 800 et 8000.';return;}
    if(!isFinite(prot)||prot<0||prot>500){$('#gErr').textContent='Protéines : un nombre entre 0 et 500.';return;}
    P.goals={cal:Math.round(cal),prot:Math.round(prot),target:isFinite(tg)&&tg>0?Math.round(tg*10)/10:''};
    var fa=num($('#gFat').value),ca2=num($('#gCarb').value),fi=num($('#gFib').value);
    if(isFinite(fa)&&fa>0&&fa<=1000)P.goals.fat=Math.round(fa);
    if(isFinite(ca2)&&ca2>0&&ca2<=2000)P.goals.carb=Math.round(ca2);
    if(isFinite(fi)&&fi>0&&fi<=300)P.goals.fib=Math.round(fi);
    saveP('goals');goalsDirty=false;render();
    var st2=$('#gState');if(st2){st2.textContent='Objectifs enregistrés';st2.className='st saved';}}
  else if(a==='prof-new')openWizard(false);
  else if(a==='prof-edit')openWizard(true);
  else if(a==='prof-switch'){meta.active=el.dataset.id;saveMeta();P=loadProfile(meta.active);
    if(!P.profile){alert('Ce profil n’a pas de fiche lisible — complète-la.');closeModal();openWizard(false);return;}
    goalsDirty=false;closeModal();TAB='day';render();}
  else if(a==='prof-rename'){var pmeta=null;meta.profiles.forEach(function(p){if(p.id===el.dataset.id)pmeta=p;});
    if(!pmeta)return;var nn=prompt('Nouveau nom :',pmeta.name);
    if(nn&&nn.trim()){pmeta.name=nn.trim();saveMeta();
      var b=loadProfile(el.dataset.id);if(b.profile){b.profile.name=nn.trim();save(pk(el.dataset.id,'profile'),b.profile);}
      if(P.id===el.dataset.id)P=loadProfile(P.id);render();}}
  else if(a==='prof-del'){var id2=el.dataset.id;var pm=null;meta.profiles.forEach(function(p){if(p.id===id2)pm=p;});
    if(!pm)return;
    if(!confirm('Supprimer le profil « '+pm.name+' » et toutes ses données ?'))return;
    if(!confirm('Vraiment sûr ? Cette action est définitive (une photo automatique du jour reste récupérable via « Chercher des données existantes »).'))return;
    ['profile','goals','journal','weights','foods'].forEach(function(part){try{touchSnapshot();localStorage.removeItem(pk(id2,part));}catch(e){}});
    meta.profiles=meta.profiles.filter(function(p){return p.id!==id2;});
    if(meta.active===id2)meta.active=meta.profiles.length?meta.profiles[0].id:null;
    saveMeta();P=meta.active?loadProfile(meta.active):null;render();}
  else if(a==='switch-open')openSwitcher();
  else if(a==='export')openExport();
  else if(a==='restore-open')openRestore();
  else if(a==='restore-apply'){var err=restoreText($('#restoreTxt').value);
    if(err){$('#restoreErr').textContent=err;return;}
    closeModal();TAB='day';render();alert('Sauvegarde restaurée.');}
  else if(a==='snap-restore'){var snap=load(NS+'.autosnap');
    if(snap&&snap.data&&confirm('Restaurer la photo automatique du '+snap.date+' ? Les données actuelles seront remplacées par celles de la photo.')){
      var e2=restoreText(snap.data);if(e2){alert(e2);return;}
      closeModal();TAB='day';render();alert('Photo restaurée.');}}
  else if(a==='track-range'){TRANGE=Number(el.dataset.n)||7;render();}
  else if(a==='day-today'){CUR=todayStr();render();}
  else if(a==='copy-yday'){var ysrc=P.journal[addDays(CUR,-1)];var lst=ysrc?ysrc[el.dataset.meal]||[]:[];
    if(lst.length){if(!P.journal[CUR])P.journal[CUR]={};
      P.journal[CUR][el.dataset.meal]=JSON.parse(JSON.stringify(lst));saveP('journal');render();}}
  else if(a==='add-sport')openSport();
  else if(a==='sport-save')sportSave();
  else if(a==='del-sport'){var dsp=P.journal[CUR];
    if(dsp&&dsp.sport){dsp.sport.splice(Number(el.dataset.idx),1);saveP('journal');render();}}
  else if(a==='rep-gen')openReport();
  else if(a==='rep-docx'){
    try{var u8=buildDocx(reportStats(M.a,M.b));
      offerDocx('rapport-table-du-jour-'+M.a+'-'+M.b+'.docx',u8);}
    catch(errD){var mD=$('#repMsg');if(mD)mD.textContent='Erreur de génération : '+errD.message;}}
  else if(a==='rep-csv-detail'||a==='rep-csv-daily'){
    var csv=a==='rep-csv-detail'?csvDetail(M.a,M.b):csvDaily(M.a,M.b);
    offerFile((a==='rep-csv-detail'?'repas':'bilan')+'-'+M.a+'-'+M.b+'.csv',csv,'text/csv;charset=utf-8');
    var ta=$('#repOut');ta.style.display='block';ta.value=csv.replace('﻿','');ta.focus();ta.select();}
  else if(a==='scan-open')openScan();
  else if(a==='scan-adopt'){var id3=el.dataset.id;var b3=loadProfile(id3);
    meta.profiles.push({id:id3,name:(b3.profile&&b3.profile.name)||'Profil récupéré'});saveMeta();
    closeModal();render();alert('Profil rattaché — tu peux l’activer dans l’onglet Profils.');}
  else if(a==='wiz-back'){W.step--;renderWiz();}
  else if(a==='wiz-next'){var er=wizRead();if(er){$('#wizErr').textContent=er;return;}W.step++;renderWiz();}
  else if(a==='wiz-create')wizCreate();
  else if(a==='wiz-sex'){W.data.sex=el.dataset.v;renderWiz();}
  else if(a==='wiz-work'){W.data.work=el.dataset.v;renderWiz();}
  else if(a==='wiz-sport-add'){var ss=num($('#spSess').value),mm=num($('#spMin').value);
    if(!isFinite(ss)||ss<=0||!isFinite(mm)||mm<=0){$('#wizErr').textContent='Indique les séances par semaine et les minutes par séance.';return;}
    $('#wizErr').textContent='';
    W.data.sports.push({type:$('#spType').value,sessions:Math.round(ss),min:Math.round(mm)});renderWiz();}
  else if(a==='wiz-sport-del'){W.data.sports.splice(Number(el.dataset.i),1);renderWiz();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='pickSearch')renderPickList(t.value);
  else if(t.id==='qtyInput'||t.id==='unitSel'||t.id==='mealSel')updateQtyPreview();
  else if(t.id==='exoMin'||t.id==='exoSel')updateExoPreview();
  else if(t.id==='foodSearch'){foodQ=t.value;var fl=$('#foodList');if(fl)fl.innerHTML=foodListHTML();}
  else if(t.id==='wKg'){var we=$('#wErr');if(we)we.textContent='';}
  else if(t.id==='rFrom')RFROM=t.value;
  else if(t.id==='rTo')RTO=t.value;
  else if(t.closest&&t.closest('#goalsForm')&&t.tagName==='INPUT'){goalsDirty=true;
    var st=$('#gState');if(st){st.textContent='Modifications non enregistrées';st.className='st dirty';}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='unitSel'||t.id==='mealSel')updateQtyPreview();
  else if(t.id==='exoSel')updateExoPreview();
  else if(t.id==='restoreFile'&&t.files&&t.files[0]){
    var r=new FileReader();r.onload=function(){$('#restoreTxt').value=String(r.result||'');};r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='wKg'){var b=document.querySelector('[data-act="weight-add"]');if(b)b.click();}
});

/* ================= démarrage (lecture seule, aucune écriture) ================= */
(function(){
  if(meta&&meta.profiles&&meta.profiles.length){
    var act=meta.active&&meta.profiles.some(function(p){return p.id===meta.active;})?meta.active:meta.profiles[0].id;
    P=loadProfile(act);
    if(!P.profile){ /* fiche illisible : on n'écrase rien, on propose le wizard */
      P=null;}
  }
  render();
})();
</script>
